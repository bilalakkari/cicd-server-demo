name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: akkarilab.xyz
          username: bilal
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/nodejs/api
            git pull
            npm install
            pm2 restart api
